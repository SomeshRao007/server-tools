name: Deploy Odoo Module

on:
  push:
    branches:
      - "18.0"
      # - staging
      # - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    container:
      image: somesh0007/myrepo:dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Determine target servers
        id: target
        run: |
          BRANCH="${{ github.ref_name }}"
          case $BRANCH in
            18.0)
              echo "group=odoo18_production" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create inventory
        run: |
          echo "${{ secrets.ANSIBLE_INVENTORY }}" > inventory.ini

      - name: Deploy to servers
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i inventory.ini ansible/deploy_odoo.yml \
            --limit "${{ steps.target.outputs.group }}" \
            --extra-vars "git_branch=${{ github.ref_name }} git_repo_url=${{ secrets.GIT_REPO_URL }}"
